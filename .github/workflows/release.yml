# Publishes a release from an annotated tag: lime for each architecture, built
# on its own runner as ci.yml builds it (amd64 at the x86-64-v3 level, and
# arm64), each in an archive with what README.md's Setup installs and the
# crates' licence notices, and a .sha256 beside it.
#
# Versions are dates, YYYY.M.D without leading zeros; a second release that
# day adds _1, then _2. The tag is v<version>, and Cargo.toml's version is the
# same date, with the suffix as build metadata, which Cargo takes where it
# refuses an underscore:
#
#   v2026.11.25    Cargo.toml 2026.11.25
#   v2026.11.25_1  Cargo.toml 2026.11.25+1
#
# The tag's message is the release's notes:
#
#   git tag -a v2026.11.25 -m "<notes>" && git push origin v2026.11.25
#
# The jobs that build hold no token that can write; only the release job, which
# builds nothing, publishes.
#
# This build alone reports to Sentry: it has the `sentry` feature and
# LIME_RELEASE, which compile the DSN in (src/diagnostics.rs, PRIVACY.md). Its
# debug files then go to Sentry, so that the crashes lime reports name their
# files and lines, from a job of its own: it alone has the Sentry token, and it
# runs nothing built here, only sentry-cli, pinned by its SHA-256, which reads
# the files. Once the GitHub release is published, another such job makes it a
# release in Sentry, lime@<version>, with its commits, finalized, with a deploy
# to `production`. Both follow regulad/tinyxnb's release.yml.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
            rustflags: -C target-cpu=x86-64-v3
            # The level the build needs, which the archive's name carries.
            suffix: amd64-v3
          - arch: arm64
            runner: ubuntu-26.04-arm
            rustflags: ""
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          cargo --version
      - name: The tag names Cargo.toml's version
        run: |
          want="${TAG#v}"
          want="${want/_/+}"
          have=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lime") | .version')
          if [ "$have" != "$want" ]; then
            echo "The tag $TAG wants version $want in Cargo.toml, which has $have."
            exit 1
          fi
      # ci.yml's cache is the dev profile's, which this release build doesn't
      # use; and a tag's run could save only for that tag, which nothing else
      # reads. So it builds from nothing.
      #
      # The dist profile keeps the line tables, for Sentry (Cargo.toml).
      - name: Build
        env:
          LIME_RELEASE: '1'
        run: cargo build --profile dist --locked --features sentry
      # The notices for the crates built in (about.toml), with cargo-about
      # pinned by its SHA-256.
      - name: cargo-about
        env:
          VERSION: 0.9.3
          ARCH: ${{ matrix.arch == 'amd64' && 'x86_64' || 'aarch64' }}
          SHA256_x86_64: 3ad1e94ea1e63d69d1961f4fb15ccbbe9575d906111f96d2cb4dce6df48f71b4
          SHA256_aarch64: eb4d9ff6ebd2518152a8308729431a04b3836e71d2bd5ead7aea69f91a71162e
        run: |
          name="cargo-about-$VERSION-$ARCH-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/$VERSION/$name.tar.gz"
          sha="SHA256_$ARCH"
          echo "${!sha}  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/$name/cargo-about" about generate --locked --fail --features sentry \
            -o THIRD-PARTY-NOTICES.txt about.hbs
      # The published copy is stripped, as the release profile's is; the
      # unstripped one, with the line tables, goes to Sentry (debug-files). Both
      # keep the ELF build ID that Sentry matches them by.
      - name: Archive
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          name="lime-${TAG#v}-linux-$SUFFIX"
          mkdir "$name" debug-files
          cp target/dist/lime "debug-files/lime-$SUFFIX"
          strip -o "$name/lime" target/dist/lime
          cp lime.service lime.example.toml README.md LICENSE.md PRIVACY.md THIRD-PARTY-NOTICES.txt "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          tar -tzvf "$name.tar.gz"
          cat "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lime-${{ matrix.suffix }}
          path: lime-*.tar.gz*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-files-${{ matrix.suffix }}
          path: debug-files/
          if-no-files-found: error
          retention-days: 1

  # Each build's unstripped binary to Sentry's lime project, as tinyxnb's
  # release.yml sends its PDBs: from a job that has the Sentry token and runs
  # nothing built here.
  debug-files:
    name: Debug files to Sentry
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: debug-files-*
          path: debug-files
          merge-multiple: true
      - name: sentry-cli
        env:
          VERSION: 3.8.2
          SHA256: c958865f9d4000183509ea21b1f04925d5390de6d8d87386b9e69f2b305070c3
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/sentry-cli" \
            "https://github.com/getsentry/sentry-cli/releases/download/$VERSION/sentry-cli-Linux-x86_64"
          echo "$SHA256  $RUNNER_TEMP/sentry-cli" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/sentry-cli"
      - name: Upload
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          cli="$RUNNER_TEMP/sentry-cli"
          for f in debug-files/*; do "$cli" debug-files check "$f"; done
          "$cli" debug-files upload -o regulad -p lime --wait debug-files

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # gh reads the notes from the tag in a clone: --notes-from-tag refuses
      # --repo. Checkout leaves the tag lightweight, pointing at the commit
      # (actions/checkout#290), so the annotated tag, message and all, is
      # fetched over it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the annotated tag
        run: |
          git fetch --force --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          if [ "$(git cat-file -t "$TAG")" != tag ]; then
            echo "$TAG isn't an annotated tag: its message is the release notes (git tag -a)."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lime-*
          path: assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l assets
          gh release create "$TAG" assets/* --title "lime ${TAG#v}" --notes-from-tag --verify-tag

  # The release in Sentry, lime@<version> as lime names it (src/diagnostics.rs),
  # with the commits since the last one, finalized, and a deploy to
  # `production`: when it was published. As regulad/tinyxnb's release.yml.
  sentry-release:
    name: Release in Sentry
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SENTRY_ORG: regulad
      TAG: ${{ github.ref_name }}
    steps:
      - name: sentry-cli
        env:
          VERSION: 3.8.2
          SHA256: c958865f9d4000183509ea21b1f04925d5390de6d8d87386b9e69f2b305070c3
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/sentry-cli" \
            "https://github.com/getsentry/sentry-cli/releases/download/$VERSION/sentry-cli-Linux-x86_64"
          echo "$SHA256  $RUNNER_TEMP/sentry-cli" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/sentry-cli"
      - name: Release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: '"$RUNNER_TEMP/sentry-cli" releases new "lime@${TAG#v}" -p lime'
      # Through Sentry's GitHub integration. Reports differ on whether an
      # organization token (Sentry's `org:ci` scope) may do this: if it can't,
      # the run shows the failure, and the release goes on without its commits.
      - name: Commits
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: '"$RUNNER_TEMP/sentry-cli" releases set-commits "lime@${TAG#v}" --commit "$GITHUB_REPOSITORY@$GITHUB_SHA"'
      - name: Finalize and deploy
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          "$RUNNER_TEMP/sentry-cli" releases finalize "lime@${TAG#v}"
          "$RUNNER_TEMP/sentry-cli" deploys new --release "lime@${TAG#v}" -e production
