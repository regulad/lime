name: Dependabot auto-merge

# Turns on GitHub's auto-merge for Dependabot's pull requests that aren't
# major updates: the weekly cargo group, which holds only minor and patch
# updates (see dependabot.yml), and security updates. GitHub then merges each
# one once CI's required checks pass (.github/settings.yml). Nothing deploys
# from master: lime is built and installed by hand (README.md).
#
# Any update but a major one merges, rather than only named groups, so that
# security updates do too. They come outside the groups, and skip the
# cooldown: CI's build and tests are what they pass before merging. Every
# GitHub Actions update, grouped or not, waits for a person, since workflow
# changes get a review, and so do major updates.
#
# Auto-merge is turned on with the DEPENDABOT_MERGE_TOKEN secret, not
# GITHUB_TOKEN. GitHub credits the merge to whoever turned auto-merge on, and
# starts no workflows for a push credited to GITHUB_TOKEN, so the merge's push
# to master wouldn't run CI, which saves the cache pull requests read. The
# token is a fine-grained personal access token for this repository only,
# with read and write access to Contents and Pull requests. It has no access
# to workflows, so it couldn't merge the GitHub Actions updates even by
# mistake. It's a Dependabot secret because runs started by Dependabot can
# only read Dependabot secrets.
on:
  pull_request:
    branches: ["master"]

permissions:
  contents: read
  pull-requests: read

jobs:
  auto-merge:
    # Only for Dependabot's own pushes. A person who pushes to its pull request
    # (to fix the lockfile, say) takes the pull request over and merges it
    # themselves; their push's run can't read Dependabot secrets in any case.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # fetch-metadata names the ecosystem as Dependabot's branch does:
      # github_actions.
      - name: Merge once CI passes
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major'
          && steps.metadata.outputs.package-ecosystem != 'github_actions'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_MERGE_TOKEN }}
