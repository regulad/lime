# Repository settings managed by the repository-settings/app (Probot "Settings" GitHub App).
# Changes merged to the default branch are applied to the repo automatically.
# Schema: https://github.com/repository-settings/app

repository:
  # See https://docs.github.com/en/rest/repos/repos#update-a-repository for all available settings.
  name: lime
  description: Automatically unlock FileVault-encrypted Apple-silicon Macs over the network
  homepage: ""
  # GitHub topics as a single comma-and-space delimited string (required by the Settings app, NOT a YAML list).
  topics: "rust, filevault, macos, apple-silicon, ssh, systemd, mdns, daemon, homelab, disk-encryption, tang"
  private: false
  has_issues: true
  has_projects: false
  has_wiki: false
  has_downloads: false
  default_branch: master
  allow_squash_merge: true
  allow_merge_commit: true
  allow_rebase_merge: true
  delete_branch_on_merge: true

labels:
  - name: bug
    color: d73a4a
    description: Something isn't working
  - name: enhancement
    color: a2eeef
    description: New feature or request
  - name: documentation
    color: 0075ca
    description: Improvements or additions to documentation
