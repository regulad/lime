# Dependabot keeps lime's dependencies current: the Rust crate (Cargo.toml,
# Cargo.lock) and the GitHub Actions in .github/workflows/.
#
# Each ecosystem gets one PR a week, on Monday morning, grouping its minor and
# patch updates; each major comes on its own. Every update waits for Parker to
# merge it once CI passes: auto-merge stays off until CI tests lime's own logic,
# not just that it builds.
#
# The cooldown holds each release back until it is two weeks old, so nothing
# ships while it's days old. Security updates skip it.
version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 14
    groups:
      cargo:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 14
    groups:
      actions:
        update-types: ["minor", "patch"]
